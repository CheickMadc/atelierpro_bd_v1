<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}Supervision{% endblock %} · {{ plat }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1A1613;--panel:#221D19;--panel2:#2C2621;--line:#3A332C;--ink:#F0E9DF;--muted:#9C9186;--brand:#E4692F;--gold:#E8A87C;--green:#4ADE80;--red:#E8705F;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Bricolage Grotesque','Hanken Grotesk',sans-serif;margin:0;letter-spacing:-.02em;}
  a{color:var(--gold);text-decoration:none;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 30px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10;}
  .brand{display:flex;align-items:center;gap:11px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:19px;color:#fff;}
  .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center;}
  .badge-sa{font-size:11px;font-weight:600;color:var(--gold);background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:100px;margin-left:4px;}
  .top .right{display:flex;align-items:center;gap:16px;font-size:14px;}
  .top .right a.out{color:var(--muted);}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 30px 70px;}
  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:28px;font-weight:700;}
  .page-head p{color:var(--muted);margin:5px 0 0;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;}
  .kpi .l{font-size:13px;color:var(--muted);font-weight:500;}
  .kpi .v{font-family:'Bricolage Grotesque',sans-serif;font-size:29px;font-weight:700;margin-top:3px;color:#fff;}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow-x:auto;}
  table{border-collapse:collapse;width:100%;}
  th,td{text-align:left;padding:13px 16px;font-size:14px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:var(--panel2);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--panel2);}
  .tag{font-size:11px;font-weight:600;padding:4px 10px;border-radius:100px;}
  .t-actif{color:#0C3B22;background:var(--green);}
  .t-expire{color:#fff;background:#8A4034;}
  .t-essai{color:#3A2A12;background:var(--gold);}
  .t-paye{color:#0C3B22;background:var(--green);}
  .t-att{color:#3A2A12;background:var(--gold);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:14px;padding:10px 16px;border-radius:10px;border:none;cursor:pointer;background:var(--brand);color:#fff;}
  .btn:hover{background:#C85527;color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn.mini{padding:6px 11px;font-size:12.5px;}
  .muted{color:var(--muted);}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 5px;}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--panel2);color:var(--ink);}
  input:focus,select:focus{outline:none;border-color:var(--brand);}
  .flash{padding:12px 15px;border-radius:12px;margin-bottom:16px;font-size:14px;}
  .flash.ok{background:#12351F;color:#8FE7AC;border:1px solid #1F5A34;}
  .flash.erreur{background:#3A1E1A;color:#F0A99C;border:1px solid #6A342C;}
  .warn{background:#3A2E12;border:1px solid #6A5320;color:#E8C87C;padding:12px 15px;border-radius:12px;margin-bottom:18px;font-size:14px;}
  .empty{padding:40px;text-align:center;color:var(--muted);}
  @media (max-width:720px){.wrap{padding:20px 16px 60px;}.top{padding:14px 16px;}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5 8.5 4l3.5 3 3.5-3 5.5 2.5-2 4-2-1v11h-10V11l-2 1z"/></svg></span>
    {{ plat }} <span class="badge-sa">SUPERVISION{% if societe %} · {{ societe }}{% endif %}</span></div>
  <div class="right">
    <a href="{{ url_for('superadmin_dashboard') }}">Ateliers</a>
    <a class="out" href="{{ url_for('deconnexion') }}">↩ Déconnexion</a>
  </div>
</div>
<div class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, m in messages %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
